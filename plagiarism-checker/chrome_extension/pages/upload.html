<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Загрузка документа</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="page-shell">

    <header class="page-header split">
      <div><h1>TextTrace EDU</h1><p>Пошаговая проверка документа курсовой работы</p></div>
      <a href="documents.html">Открыть журнал</a>
    </header>
    <section class="step-panel">
      <div class="step-label">Шаг 1. Сведения о студенте</div>
      <div class="form-grid">
        <input id="fullName" placeholder="Ф.И.О." value="Умецкая Екатерина">
        <input id="course" placeholder="Курс" value="2">
        <input id="faculty" placeholder="Факультет" value="Факультет цифровых технологий">
        <input id="program" placeholder="Направление подготовки" value="Программная инженерия">
        <input id="group" placeholder="Группа" value="ПИ-22-2">
      </div>
    </section>
    <section class="step-panel accent-panel">
      <div class="step-label">Шаг 2. Файл DOC/DOCX</div>
      <div id="dropZone" class="drop-zone rounded">Перетащите документ в эту область</div>
      <input type="file" id="fileInput" accept=".doc,.docx" hidden>
      <p id="fileInfo" class="muted">Файл не выбран</p>
      <button id="selectButton" class="button" type="button">Выбрать файл</button>
      <button id="uploadButton" class="button primary" type="button">Проверить работу</button>
    </section>
    <section id="resultSection" class="step-panel result hidden"><div class="step-label">Шаг 3. Итог анализа</div><div id="resultContent"></div></section>

  </main>
  <script src="../js/config.js"></script>
  <script src="../js/encoding.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/upload.js"></script>
</body>
</html>
