<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Загрузка документа</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="page-shell">

    <header class="page-header">
      <h1>DocScope EK: загрузка документа</h1>
      <a href="documents.html">Список загруженных документов</a>
    </header>
    <section class="grid two">
      <form class="panel" id="studentForm">
        <h2>Данные студента</h2>
        <input id="fullName" placeholder="Ф.И.О." value="Умецкая Екатерина">
        <input id="course" placeholder="Курс" value="3 курс">
        <input id="faculty" placeholder="Факультет" value="Физико-технический факультет">
        <input id="program" placeholder="Направление подготовки" value="Информатика и вычислительные технологии">
        <input id="group" placeholder="Группа" value="ИВТ">
      </form>
      <section class="panel">
        <h2>DOC/DOCX файл</h2>
        <div id="dropZone" class="drop-zone">Перетащите файл сюда<br><span>или выберите через диалог</span></div>
        <input type="file" id="fileInput" accept=".doc,.docx" hidden>
        <p id="fileInfo" class="muted">Файл не выбран</p>
        <button id="selectButton" class="button" type="button">Выбрать файл</button>
        <button id="uploadButton" class="button primary" type="button">Загрузить и проверить</button>
      </section>
    </section>
    <section id="resultSection" class="panel result hidden"><h2>Результат</h2><div id="resultContent"></div></section>

  </main>
  <script src="../js/config.js"></script>
  <script src="../js/encoding.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/upload.js"></script>
</body>
</html>
